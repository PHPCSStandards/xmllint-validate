# The action runner references in the README file are pinned to the latest release as
# per the current best practices security-wise.
# This workflow creates a PR after a release to update the pins to the latest version.

name: "Update README pins"

on:
  # Run whenever a release is published.
  release:
    types: [published]
  # And whenever this workflow is being updated.
  push:
    paths:
      - '.github/workflows/update-readme-after-release.yml'
  pull_request:
    paths:
      - '.github/workflows/update-readme-after-release.yml'
  # Also allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions should be configured at the job level.
permissions: {}

jobs:
  update-readme-pins:
    permissions:
      contents: write # To clone the repo and commit the workflow results.
      pull-requests: write # To create a PR with the changes.

    # Only run this workflow in the context of this repo.
    if: github.repository_owner == 'PHPCSStandards'

    name: "Update README pins"
    runs-on: ubuntu-latest

    steps:
      - name: Set branches to use
        id: branches
        run: |
          echo "BASE=develop" >> "$GITHUB_OUTPUT"
          echo "PR_BRANCH=feature/update-readme-after-release" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branches.outputs.BASE }}
          persist-credentials: false

      # See: https://github.com/suzuki-shunsuke/pinact/blob/main/README.md
      # See: https://github.com/suzuki-shunsuke/pinact/blob/main/docs/codes/001.md
      - name: Update the action runner pins in the README
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          skip_push: "true"
          fix: "true"
          update: "true"
          review: "false"

      - name: "Debug info: Show git status"
        run: git status -vv --untracked=all

      - name: Create pull request
        id: createpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ steps.branches.outputs.BASE }}
          branch: ${{ steps.branches.outputs.PR_BRANCH }}
          delete-branch: true
          sign-commits: true
          commit-message: "README: update pins in example code after release"
          title: "README: update pins in example code after release"
          # yamllint disable rule:line-length
          body: |
            This PR is auto-generated by [create-pull-request](https://github.com/peter-evans/create-pull-request) using the [`happy-new-year.yml` workflow](https://github.com/PHPCSStandards/PHP_CodeSniffer/blob/HEAD/.github/workflows/happy-new-year.yml).
          # yamllint enable rule:line-length
          labels: |
            Type: documentation
          reviewers: |
            jrfnl

      - name: "Fail if no PR was created"
        #if: github.event_name == 'release'
        if: ${{ ! steps.createpr.outputs.pull-request-number }}
        run: exit 1
